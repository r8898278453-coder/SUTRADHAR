name: SUTRADHAR CI

on:
  push:
    branches:
      - 'fix/**'
      - 'ai/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# New PR commits supersede previous CI attempts. Keep push and PR refs separate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: TypeScript, unit checks, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Lockfile is pending; npm install is deliberately used instead of npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Security and state tests
        run: npm test
      - name: Wait for Docker daemon (required for real integration)
        run: |
          sudo systemctl start docker || true
          for attempt in $(seq 1 20); do
            if timeout 12s docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              exit 0
            fi
            sleep 2
          done
          echo "Docker daemon unavailable: integration tests cannot be verified" >&2
          exit 1
      - name: Real HTTP and Docker integration
        run: npm run test:sandbox-http
      - name: Build
        run: npm run build
      - name: Desktop setup security validation
        run: npm run test:desktop
      - name: Validate ops policy and backup security tests
        run: npm run test:ops
      - name: Validate release gate tests
        run: npm run test:release-gates
      - name: Separate Central and Desktop staging builds (no publish)
        run: npm run test:packages

  python:
    name: Python syntax, shell syntax, state tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python3 -m compileall -q core sequential_runner.py
      - name: Check shell scripts
        run: bash -n sandbox/run_sandbox.sh hooks/pre-receive
      - name: Python state and worker tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Wait for Docker daemon (required for real integration)
        run: |
          sudo systemctl start docker || true
          for attempt in $(seq 1 20); do
            if timeout 12s docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              exit 0
            fi
            sleep 2
          done
          echo "Docker daemon unavailable: integration tests cannot be verified" >&2
          exit 1
      - name: Real Git snapshot and Docker test integration
        env:
          SUTRADHAR_REAL_DOCKER_E2E: "1"
        run: python3 -m unittest discover -s tests -p 'test_sandbox_execution.py' -v
      - name: Real rollback Git archive and Docker test integration
        env:
          SUTRADHAR_REAL_DOCKER_E2E: "1"
        run: python3 -m unittest discover -s tests -p 'test_rollback_pipeline.py' -v

  v7-mysql:
    name: V7 real MySQL API integration (disposable database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: sutradhar_v7_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      SUTRADHAR_V7_NO_LISTEN: "true"
      SUTRADHAR_RUN_V7_MYSQL_TEST: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: testpass
      DB_NAME: sutradhar_v7_ci
      SUTRADHAR_ADMIN_KEY: ci-only-admin-secret-000000000000001
      SUTRADHAR_ENROLLMENT_CODE: ci-only-enrollment-secret-000000001
      SUTRADHAR_ALLOW_MIGRATIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify V7 pure election and scope policy
        run: npm run test:v7
      - name: Verify signed HTTP/MySQL cluster and independent QA lifecycle
        run: npm run test:v7-mysql

  desktop-windows-qa:
    name: Windows Desktop unsigned installer smoke (internal QA only)
    # The unsigned package is never uploaded, published or released.
    # Run only once per PR update, not twice on push and PR.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source build dependencies
        run: npm install --no-audit --no-fund
      - name: Test local first-run setup validators
        run: npm run test:desktop
      - name: Build Desktop PC agent/worker only
        run: npm run build:desktop
      - name: Install unsigned QA Electron packager
        run: npm install --prefix apps/desktop --no-audit --no-fund
      - name: Create QA installer without signing or publishing
        env:
          SUTRADHAR_ALLOW_UNSIGNED_QA_PACKAGE: "true"
        run: npm --prefix apps/desktop run pack:qa
      - name: Verify QA installer was generated
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path apps/desktop/out -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw 'No Windows QA installer generated' }
          Write-Host ('Internal QA-only Windows installer generated: ' + $installers.Count)
          Write-Host 'No artifact uploaded, signed, published, deployed or approved for use.'

name: Dependency Lockfile Proposal (review-only)

# Candidate generation is isolated from trusted CI and production signing.
# No Git writes, merge, deployment, release or installer upload.
on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "apps/desktop/package.json"
      - "apps/desktop/runtime-policy.cjs"
      - "scripts/release/prepare-lockfile-candidate.cjs"
      - ".github/workflows/dependency-lock-proposal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-proposal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Generate reviewable lockfiles (never commits)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve dependencies without package lifecycle scripts
        env:
          SUTRADHAR_PREPARE_LOCK_CANDIDATE: "true"
        run: node scripts/release/prepare-lockfile-candidate.cjs
      - name: Confirm all lock candidates are present
        run: |
          test -s package-lock.json
          test -s apps/desktop/package-lock.json
          test -s lock-candidate-summary.json
      - name: Upload review-only dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: sutradhar-lockfile-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            package.json
            package-lock.json
            apps/desktop/package.json
            apps/desktop/package-lock.json
            lock-candidate-summary.json


  locked-install:
    name: Review-only npm ci across platforms
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: sutradhar-lockfile-candidate
          path: .
      - name: Validate clean installs using proposed exact integrity locks
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/desktop --ignore-scripts --no-audit --no-fund
      - name: Verify proposal manifest and npm integrity locks before tests
        run: npm run check:dependency-locks
      - name: Validate release/dependency contracts with proposed locks
        run: |
          npm run lint
          npm run test:desktop
          npm run test:release-gates
      - name: Clarify acceptance
        run: echo "Candidate npm ci was tested; owner dependency audit and commit are still required."
